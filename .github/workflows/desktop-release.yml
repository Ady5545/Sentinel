name: Package SENTINEL for macOS and Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/implementation-quarter-4-*'
    tags:
      - 'desktop-v*'
  pull_request:
    branches:
      - main
      - 'feat/implementation-quarter-3-*'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            target_id: macos-arm64
            artifact: macOS-Apple-Silicon
          - os: windows-latest
            target: win
            target_id: windows-x64
            artifact: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Electron entry points and serial tests
        run: npm run check:main
      - name: Run domain tests
        run: npm test
      - name: Test release qualification tooling
        run: npm run test:qualification
      - name: Build renderer
        run: npm run build:renderer
      - name: Generate native application icons
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          python scripts/generate-app-icons.py
      - name: Package macOS Apple Silicon
        if: matrix.target == 'mac'
        run: npx electron-builder --mac dmg zip --arm64 --publish never
      - name: Package Windows x64
        if: matrix.target == 'win'
        run: npx electron-builder --win nsis zip --x64 --publish never
      - name: Generate pinned source and artifact SHA-256 manifest
        shell: bash
        run: |
          args=()
          for file in release/*; do
            if [[ -f "$file" ]]; then args+=(--artifact "$file"); fi
          done
          node scripts/release-qualification.mjs create \\
            --commit "$GITHUB_SHA" \\
            --target "${{ matrix.target_id }}" \\
            --output release/qualification-manifest.json \\
            "${args[@]}"
      - name: Verify manifest, checksums and exact source commit
        shell: bash
        run: |
          node scripts/release-qualification.mjs verify \\
            --commit "$GITHUB_SHA" \\
            --manifest release/qualification-manifest.json
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SENTINEL-${{ matrix.artifact }}-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
