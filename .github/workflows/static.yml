name: Deploy SENTINEL ATM simulator to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Vite application for GitHub Pages
        run: npm run build

      - name: Verify compiled application and favicon
        run: |
          test -f dist/index.html
          test -f dist/favicon.svg
          grep -q '/Sentinel/assets/' dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload compiled website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy compiled website
        id: deployment
        uses: actions/deploy-pages@v5
