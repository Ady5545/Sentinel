name: Build and test SENTINEL desktop app

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Electron entry points
        run: npm run check:main
      - name: Run domain tests
        run: npm test
      - name: Build local renderer
        run: npm run build:renderer
      - name: Verify packaged renderer
        run: test -f dist/index.html
